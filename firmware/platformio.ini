; PlatformIO Project Configuration
; ESP32 Motor Control Firmware for WYZECAR
;
; Uses ESP-IDF I2C slave API (not Arduino Wire - which is broken for slave mode)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time

; Build flags - disable framework logging
build_flags = 
    -D CORE_DEBUG_LEVEL=0

; Libraries
lib_deps = 
    ESP32Servo@^0.13.0

; Upload settings
upload_speed = 115200
upload_port = /dev/cu.usbserial*

; Debug environment
[env:esp32dev_debug]
platform = espressif32
board = esp32dev
framework = arduino
build_type = debug

debug_tool = esp-prog
debug_init_break = tbreak setup

monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder
    time
    log2file

build_flags = 
    -D CORE_DEBUG_LEVEL=5
    -D CONFIG_ARDUHAL_LOG_COLORS=1
    -D DEBUG_ESP_PORT=Serial
    -O0
    -ggdb3

lib_deps = 
    ESP32Servo@^0.13.0

upload_speed = 115200
